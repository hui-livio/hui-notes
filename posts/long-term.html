<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在不确定里，练习做长期主义者｜未完手记</title><link rel="stylesheet" href="../style.css"><style>article{display:block;max-width:720px;margin:auto;border:0;padding:80px 24px}article h1{font-family:Georgia,'Microsoft YaHei',serif;font-size:clamp(42px,7vw,78px);line-height:1.15;letter-spacing:-.07em}article p{font-family:Georgia,'Microsoft YaHei',serif;font-size:18px;line-height:2;margin:32px 0}article a{border-bottom:1px solid;padding-bottom:5px}</style></head><body><header><a class="logo" href="../">未完手记<span>。</span></a><nav><a href="../#writing">文章</a><a href="../#about">关于</a></nav></header><main><article><small>思考札记 · 2026.08.18 · 6 分钟</small><h1>在不确定里，练习做长期主义者</h1><p>世界不断催促我们得出答案。但有些真正重要的事情，需要先允许自己停留在问题里。</p><p>真正的耐心，不是等待事情发生，而是持续把注意力放在值得的地方。写作、学习、建立关系，都是如此。</p><p>今天也不急着证明什么。把手边的一件小事做好，给明天留一点空间。答案会在路上变得清晰。</p><a href="../">← 返回首页</a></article></main></body></html>
